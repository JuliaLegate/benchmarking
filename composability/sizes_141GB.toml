# Float32 sweeps for 141 GB H200 GPUs.
# CG weak base uses the largest reported passing one-GPU size.
# Heat stops at 32768 after the 65536 case proved too large.
# single: increasing matrix/grid dimensions N for one-GPU size sweeps.
# weak_base: dimension N on one GPU; multi-GPU runs use round(N * sqrt(G)).
# Validate larger sizes on every backend before raising weak_base.

[krylov]
# Avoid some of the higher powers of 2, cuBlas was having some weird behavior
single = [1024, 2048, 4096, 8192, 16384, 32500, 65000, 81920, 114688, 130000]
weak_base = 130000

[ordinarydiffeq]
single = [128, 512, 1024, 2048, 4096, 8192, 16384, 32768]
weak_base = 32768

[integrals_optimization]
# Estimated endpoint at 1.25x the H100 dimension N (1.5625x array storage).
single = [32, 128, 512, 1024, 2048, 4096, 6144, 8192, 10240]
weak_base = 10240

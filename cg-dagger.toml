# cuNumeric vs Dagger.jl CG weak scaling, 1-4 GPUs (sizes from configs/multi_gpu).
[Global]
models = ["cunumeric", "dagger"]
n_warmup = 1
n_iter = 1
n_trial = 5
check_correctness = true
auto_size = false

[[cg]]
T = "Float64"
gpus = [1, 2, 4]
cpus = 8
N = [90000000, 180000000, 360000000]
M = 1
kwargs = { check_every = 10, max_iter = 1000 }

name: Benchmark container build and push

on:
  workflow_dispatch:
    inputs:
      base_image:
        description: 'Existing cuNumeric base image (use a tag or digest for reproducibility)'
        required: false
        default: 'ghcr.io/julialegate/cunumeric.jl:dev'
  # The job condition implements the [benchmark-container] opt-in.
  push:

concurrency:
  group: benchmark-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  push_to_registry:
    if: >-
      ${{
        !contains(toJSON(github.event), '[skip ci]') &&
        (
          github.event_name == 'workflow_dispatch' ||
          (
            github.event_name == 'push' &&
            contains(github.event.head_commit.message, '[benchmark-container]')
          )
        )
      }}
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Select image names
        id: images
        env:
          REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
          INPUT_BASE_IMAGE: ${{ inputs.base_image }}
        run: |
          registry_image=${REGISTRY_IMAGE,,}
          commit=$(git rev-parse --short=12 HEAD)

          base_image=${INPUT_BASE_IMAGE:-ghcr.io/julialegate/cunumeric.jl:dev}

          echo "base=$base_image" >> "$GITHUB_OUTPUT"
          echo "immutable=${registry_image}:${commit}-benchmark-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "rolling=${registry_image}:dev-benchmark" >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-benchmark
          key: benchmark-container-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: benchmark-container-

      - name: Build benchmark image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          provenance: false
          tags: |
            ${{ steps.images.outputs.immutable }}
            ${{ steps.images.outputs.rolling }}
          cache-from: type=local,src=/tmp/.buildx-cache-benchmark/current
          cache-to: type=local,dest=/tmp/.buildx-cache-benchmark/new,mode=max
          build-args: |
            BASE_IMAGE=${{ steps.images.outputs.base }}
            DEPENDENCY_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Test benchmark harness
        run: |
          docker run --rm "${{ steps.images.outputs.immutable }}" \
            julia --project=. test/runtests.jl

      - name: Push benchmark image
        env:
          IMMUTABLE_IMAGE: ${{ steps.images.outputs.immutable }}
          ROLLING_IMAGE: ${{ steps.images.outputs.rolling }}
        run: |
          docker push "$IMMUTABLE_IMAGE"
          docker push "$ROLLING_IMAGE"

      - name: Update Docker layer cache
        run: |
          rm -rf /tmp/.buildx-cache-benchmark/current
          mv /tmp/.buildx-cache-benchmark/new /tmp/.buildx-cache-benchmark/current

      - name: Save image tag
        env:
          IMMUTABLE_IMAGE: ${{ steps.images.outputs.immutable }}
        run: echo "$IMMUTABLE_IMAGE" > benchmark_image_tag.txt

      - name: Upload tag artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-docker-tag
          path: benchmark_image_tag.txt

      - name: Remove local images
        if: always()
        env:
          IMMUTABLE_IMAGE: ${{ steps.images.outputs.immutable }}
          ROLLING_IMAGE: ${{ steps.images.outputs.rolling }}
        run: |
          docker image rm "$IMMUTABLE_IMAGE" || true
          docker image rm "$ROLLING_IMAGE" || true

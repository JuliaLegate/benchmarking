name: Environment setup tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: setup-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instantiate:
    name: Instantiate projects (Julia 1.13.1)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CUNUMERIC_SOURCE: ${{ github.workspace }}/.ci/cuNumeric.jl
      SETUP_TEST_OUTPUT: ${{ github.workspace }}/results/instantiate-tests
      JULIA_PKG_PRECOMPILE_AUTO: '0'
      LEGATE_SKIP_RUNTIME: 'true'
      LEGATE_AUTO_CONFIG: '0'
      JULIA_NUM_THREADS: '2'
    steps:
      - name: Check out benchmarking
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out cuNumeric.jl
        uses: actions/checkout@v4
        with:
          repository: JuliaLegate/cuNumeric.jl
          # The benchmark environments require cuNumeric 0.3 and CNPreferences 0.1.4.
          ref: develop
          path: .ci/cuNumeric.jl
          persist-credentials: false

      - name: Install Julia 1.13.1
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.13.1'

      - uses: julia-actions/cache@v2

      - name: Install Conda for IGG MPI
        shell: bash
        run: |
          wget --no-verbose \
            https://github.com/conda-forge/miniforge/releases/download/25.3.1-0/Miniforge3-25.3.1-0-Linux-x86_64.sh \
            -O "$RUNNER_TEMP/miniforge.sh"
          bash "$RUNNER_TEMP/miniforge.sh" -b -p "$RUNNER_TEMP/igg-conda"
          echo "CUNUMERIC_BENCH_CONDA=$RUNNER_TEMP/igg-conda/bin/conda" >> "$GITHUB_ENV"

      - name: Record tested versions
        shell: bash
        run: |
          mkdir -p "$SETUP_TEST_OUTPUT"
          julia --startup-file=no -e 'using InteractiveUtils; VERSION == v"1.13.1" || error("Expected Julia 1.13.1"); versioninfo()' \
            | tee "$SETUP_TEST_OUTPUT/julia-version.txt"
          git rev-parse HEAD > "$SETUP_TEST_OUTPUT/benchmark-commit.txt"
          git -C "$CUNUMERIC_SOURCE" rev-parse HEAD > "$SETUP_TEST_OUTPUT/cunumeric-commit.txt"

      - name: Test setup paths and composability CLI
        shell: bash
        run: |
          python3 -m unittest discover -s test -p test_setup.py -v
          bash test/composability_tuning.sh
          julia --startup-file=no test/composability_tuning.jl
          julia --startup-file=no --project=. test/composability_cli.jl
          julia --startup-file=no --project=. test/krylov_validation.jl
          julia --startup-file=no --project=. test/ode_cleanup.jl

      - name: Instantiate and verify all environments
        shell: bash
        run: |
          julia --startup-file=no --project=. test/instantiate_projects.jl 2>&1 \
            | tee "$SETUP_TEST_OUTPUT/instantiate.log"

      - name: Upload setup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-julia-1.13.1
          path: results/instantiate-tests/
          if-no-files-found: warn

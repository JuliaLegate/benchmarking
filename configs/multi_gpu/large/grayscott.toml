# Gray-Scott weak scaling sized for 140 GB GPUs (H200); see ../grayscott.toml for 80 GB.
[Global]
models = ["cunumeric", "cupynumeric"]
n_warmup = 1
n_iter = 10
n_trial = 3
check_correctness = true
n_correctness_iter = 5
auto_size = false

[[grayscott]]
T = "Float32"
gpus = [1, 2, 4, 8]
cpus = 8
N = [36000, 50912, 72000, 101824]
M = [36000, 50912, 72000, 101824]
fusion = true

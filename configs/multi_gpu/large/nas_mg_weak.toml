# NAS MG weak scaling sized for 140 GB GPUs (H200); class[i] runs on gpus[i]. Every
# point is four times class B's per-GPU grid points and 20 V-cycles; C verifies,
# B.4 (256x512x512), C.2 (512x512x1024) and C.4 (512x1024x1024) skip.
#   julia --project=. run.jl --config=configs/multi_gpu/large/nas_mg_weak.toml
[Global]
n_warmup = 1
n_iter = 10
n_trial = 3
check_correctness = true
auto_size = false
models = ["cunumeric", "cupynumeric", "cudajl", "jacc"]

[[nas_mg]]
T = "Float64"
gpus = [1, 2, 4, 8]
cpus = 8
kwargs = { class = ["B.4", "C", "C.2", "C.4"] }

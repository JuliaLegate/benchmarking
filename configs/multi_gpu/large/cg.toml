# CG weak scaling sized for 140 GB GPUs (H200): 300,000,000 elements on one GPU.
[Global]
models = ["cunumeric", "cupynumeric", "jacc"]
n_warmup = 1
n_iter = 1
n_trial = 5
check_correctness = true
auto_size = false

[[cg]]
models = ["cunumeric", "cupynumeric", "jacc"]
T = "Float64"
gpus = [1, 2, 4, 8]
cpus = 8
N = [300000000, 600000000, 1200000000, 2400000000]
M = 1
kwargs = { check_every = 10, max_iter = 1000 }

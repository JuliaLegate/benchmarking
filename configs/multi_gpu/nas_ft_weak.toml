# NAS FT weak scaling; class[i] runs on gpus[i]. Every point is class A's per-GPU
# grid points and 6 NAS time steps; A and B.4 (class B's grid) verify, A.2 and B.8 skip.
#   julia --project=. run.jl --config=configs/multi_gpu/nas_ft_weak.toml
[Global]
n_warmup = 2
n_iter = 20
n_trial = 5
check_correctness = true
auto_size = false
models = ["cunumeric", "cupynumeric", "cudajl", "jacc", "dagger"]

[[nas_ft]]
T = "Float64"
gpus = [1, 2, 4, 8]
cpus = 8
kwargs = { class = ["A", "A.2", "B.4", "B.8"] }

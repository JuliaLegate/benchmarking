# cuNumeric fused mapreduce versus broadcast materialization followed by sum,
# with cuPyNumeric for reference. N pinned to the sizes cuNumeric auto-sized to
# at mem_frac = 0.9 in results-brev (20261005-224227-evLB1b): N = 1356793376 * P.
#   julia --project=. run.jl --config=configs/multi_gpu/montecarlo_forms.toml
[Global]
n_warmup = 2
n_iter = 20
n_trial = 5
check_correctness = true
auto_size = false
models = ["cunumeric", "cupynumeric"]

[plot.groups]
montecarlo = ["montecarlo", "montecarlo_naive"]

[[montecarlo]]
T = "Float32"
gpus = [1, 2, 4, 8]
cpus = 8
fusion = true
N = [1356793376, 2713586752, 5427173504, 10854347008]
M = 1

[[montecarlo_naive]]   # cuNumeric only
T = "Float32"
gpus = [1, 2, 4, 8]
cpus = 8
fusion = [true, false]
N = [1356793376, 2713586752, 5427173504, 10854347008]
M = 1

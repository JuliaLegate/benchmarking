# Gray-Scott @accelerate scope-contract comparison (cuNumeric only).
# The four accelerated forms plus the baseline share one weak-scaling figure,
# each run with fusion on and off.
#   julia --project=. run.jl --config=configs/multi_gpu/grayscott_forms.toml
[Global]
n_warmup = 2
n_iter = 50
n_trial = 5
models = ["cunumeric"]
check_correctness = true
n_correctness_iter = 5
auto_size = false

[plot.groups]
grayscott = [
    "grayscott_plain",
    "grayscott_function_accelerated",
    "grayscott_begin_accelerated",
    "grayscott_let_accelerated",
    "grayscott_expression_accelerated",
]

[[grayscott_plain]]
T = "Float32"
gpus = [1, 2, 4, 8]
cpus = 8
fusion = ["on", "off"]
N = [28000, 39600, 56000, 79200]
M = [28000, 39600, 56000, 79200]

[[grayscott_function_accelerated]]
T = "Float32"
gpus = [1, 2, 4, 8]
cpus = 8
fusion = ["on", "off"]
N = [28000, 39600, 56000, 79200]
M = [28000, 39600, 56000, 79200]

[[grayscott_begin_accelerated]]
T = "Float32"
gpus = [1, 2, 4, 8]
cpus = 8
fusion = ["on", "off"]
N = [28000, 39600, 56000, 79200]
M = [28000, 39600, 56000, 79200]

[[grayscott_let_accelerated]]
T = "Float32"
gpus = [1, 2, 4, 8]
cpus = 8
fusion = ["on", "off"]
N = [28000, 39600, 56000, 79200]
M = [28000, 39600, 56000, 79200]

[[grayscott_expression_accelerated]]
T = "Float32"
gpus = [1, 2, 4, 8]
cpus = 8
fusion = ["on", "off"]
N = [28000, 39600, 56000, 79200]
M = [28000, 39600, 56000, 79200]
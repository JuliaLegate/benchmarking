# NAS FT strong scaling.
#   julia --project=. run.jl --config=configs/multi_gpu/nas_ft_strong.toml
[Global]
n_warmup = 1
n_iter = 1
n_trial = 3
check_correctness = true
auto_size = false
models = ["cunumeric", "cupynumeric", "cudajl", "jacc", "dagger"]

[[nas_ft]]
T = "Float64"
gpus = [1, 2, 4, 8]
cpus = 8
kwargs = { class = "B" }

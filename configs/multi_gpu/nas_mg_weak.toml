# NAS MG weak scaling; class[i] runs on gpus[i]. Every point is class B's per-GPU
# grid points and 20 V-cycles; B and C verify, B.2 (256x256x512) and B.4
# (256x512x512) have no NAS reference and skip.
#   julia --project=. run.jl --config=configs/multi_gpu/nas_mg_weak.toml
[Global]
n_warmup = 2
n_iter = 20
n_trial = 5
check_correctness = true
auto_size = false
models = ["dagger"]

[[nas_mg]]
T = "Float64"
gpus = [1, 2, 4, 8]
cpus = 8
kwargs = { class = ["B", "B.2", "B.4", "C"] }

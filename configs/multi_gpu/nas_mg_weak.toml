# NAS MG weak scaling; class[i] runs on gpus[i]. MG grids are power-of-two
# cubes (8x apart), so constant per-GPU work only fits 1 and 8 GPUs.
#   julia --project=. run.jl --config=configs/multi_gpu/nas_mg_weak.toml
[Global]
n_warmup = 1
n_iter = 1
n_trial = 3
check_correctness = true
auto_size = false
models = ["cunumeric", "cupynumeric", "cudajl", "jacc", "dagger"]

[[nas_mg]]
T = "Float64"
gpus = [1, 8]
cpus = 8
kwargs = { class = ["B", "C"] }

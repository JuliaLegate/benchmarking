# CG weak scaling from 90,000,000 elements on one GPU (10x the NAS Class E 9,000,000).
[Global]
models = ["dagger"]
n_warmup = 1
n_iter = 1
n_trial = 5
check_correctness = true
auto_size = false

[[cg]]
models = ["dagger"]
T = "Float64"
gpus = [1, 2, 4, 8]
cpus = 8
N = [90000000, 180000000, 360000000, 720000000]
M = 1
kwargs = { check_every = 10, max_iter = 1000 }

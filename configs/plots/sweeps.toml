# Single-GPU size sweeps (plot_sweeps.jl): x = problem size, one panel per benchmark.

metrics = ["time", "throughput"]
columns = 2
panel_size = [400, 320]
legend_scale = 1.0
marker_scale = 0.6   # dense x points
format = "pdf"
width_in = 3.5   # one IEEE column
font_size = 6

[[panel]]
benchmark = "grayscott"
members = ["grayscott_function_accelerated"]
results = "results-brev/20261005-235912-5SOKy7"
xlabel = "Grid size N (N×N)"
labels = { "PIE.jl (function accelerated)" = "PIE.jl", "PIE.jl (function accelerated, unfused)" = "PIE.jl (unfused)" }

[[panel]]
benchmark = "montecarlo"
members = ["montecarlo", "montecarlo_naive"]
results = "results-brev/20261006-001716-XNYg0g"
xlabel = "Samples"
hide = ["PIE.jl (naive)"]
labels = { "PIE.jl (naive, unfused)" = "PIE.jl (unfused)" }

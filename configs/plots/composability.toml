# CSV selections for plot_composability.jl combined.
# CSV paths are relative to results_root (override with --results-root=DIR),
# which is relative to results/paper.
# Figure sizing and fonts remain in figures.toml.
results_root = "composability"

[krylov]
cuda = "single/krylov/results.csv"
cunumeric-single = "single/krylov/results.csv"
cunumeric-multi = "multi/krylov/results.csv"
dagger-single = "single/krylov/results.csv"
dagger-multi = "multi/krylov/results.csv"

[ode]
cuda = "single/ordinarydiffeq/results.csv"
cunumeric-single = "single/ordinarydiffeq/results.csv"
cunumeric-multi = "multi/ordinarydiffeq/results.csv"
dagger-single = "single/ordinarydiffeq/results.csv"

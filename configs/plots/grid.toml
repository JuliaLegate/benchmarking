# Benchmark grid: one figure per metric, one panel per [[panel]] (plot_grid.jl).
# Panel keys: benchmark, results, members, title, log, hide,
#   split = { metric = value } (broken y axis), note = { text, model, at }

metrics = ["throughput", "time", "efficiency"]
gridlines = true
columns = 2
legend_scale = 1.0
panel_size = [400, 220]
format = "pdf"
width_in = 3.5   # one IEEE column
font_size = 6
compact = true   # shared y label, fewer y ticks
legend_columns = 2

[[panel]]
benchmark = "gemm"
results = "gemm"
note = { text = "JACC omitted:\nno BLAS-3 GEMM", model = "JACC.jl" }

[[panel]]
benchmark = "montecarlo"
results = "montecarlo"

[[panel]]
benchmark = "grayscott"
results = "grayscott"

[[panel]]
benchmark = "cg"
results = "cg"

[[panel]]
benchmark = "nas_ep"
results = "nas_ep"
log = true

[[panel]]
benchmark = "nas_ft"
results = "nas_ft"
split = { time = 350 }   # Dagger at 2+ GPUs

[[panel]]
benchmark = "nas_mg"
results = "nas_mg"

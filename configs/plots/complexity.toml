# Complexity vs performance: one figure per GPU count, one panel per metric.
#   julia --project=. plot_complexity.jl [--config=...] [--out=plots/complexity]
# y = fastest time / model time (1 = fastest). Style keys match grid.toml.

grid = "configs/plots/grid.toml"           # runs to plot
loc = "loc-analysis/results/summary.csv"   # scc counts
metrics = ["cyclomatic", "sloc"]  # "cyclomatic", "uloc", "sloc"
gpus = [1, 2, 4, 8]
hide = ["cuPyNumeric"] # legend labels to leave out
mean = true   # large outlined marker at each model's mean
ideal = true  # mark the ideal point (0 complexity, fastest)

panel_size = [400, 340]
legend_scale = 1.0   # same as the other 1x2 figures
format = "pdf"
width_in = 3.5   # one IEEE column, like the other 1x2 figures
font_size = 6

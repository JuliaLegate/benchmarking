# Complexity vs performance: one figure per GPU count (plot_complexity.jl).
# y = fastest time / model time (1 = fastest).

grid = "configs/plots/grid.toml"           # runs to plot
loc = "loc-analysis/results/summary.csv"   # scc counts
metrics = ["cyclomatic", "sloc"]           # also "uloc"
gpus = [1, 2, 4, 8]
hide = ["cuPyNumeric"]
mean = true    # mean marker per model
ideal = true   # ideal point (0 complexity, fastest)

panel_size = [400, 340]
legend_scale = 1.0
format = "pdf"
width_in = 3.5   # one IEEE column
font_size = 6

# Standalone figures (plot_figures.jl). A fusion list writes one file per metric
# and setting; a single setting writes one file with a panel per metric.
# Figure keys: config, results, fusion, name, metrics, title, legend_title,
#   labels.<fusion>.<series> (legend text; sorted by its first number),
#   colorbar = { label, values = { series = number } } (one color per distinct value, light→dark)
#   log = [metrics] (log y-axis for those metrics)

format = "pdf"
width_in = 3.5   # one IEEE column
font_size = 6
panel_size = [400, 320]
legend_scale = 1.0

[[figure]]   # Gray-Scott @accelerate forms
config = "configs/multi_gpu/grayscott_forms.toml"
results = "results-brev/20261001-042330-0ADaZK"
fusion = ["on", "off"]
# Grids left to the GC per step (function 0, let 0, begin 4, expr 6, plain 22)
# × ~3.14 GB per grid per GPU (weak scaling keeps it fixed).
colorbar.label = "Garbage Collector\nBurden [GB/GPU/Iter]"
colorbar.values = { func = 0, let = 0, begin = 13, expr = 19, plain = 69 }
labels = { on = { function = "func" }, off = { function = "func" } }   # fits the legend column
log = ["time"]   # forms span ~12 ms to ~840 ms

[[figure]]   # Gray-Scott: cuNumeric (fused/unfused), cuPyNumeric, ImplicitGlobalGrid
config = "configs/multi_gpu/grayscott.toml"
results = "results-brev/grayscott-compare"
fusion = "both"
name = "grayscott_compare"
metrics = ["throughput", "time"]
title = ""

[[figure]]   # Monte Carlo: fused mapreduce vs broadcast + sum (naive), fused and unfused
config = "configs/multi_gpu/montecarlo_forms.toml"
results = "results-brev/20261005-224227-evLB1b"
fusion = "both"
name = "montecarlo_forms"
metrics = ["throughput", "time"]
title = ""

[[figure]]   # Fusion: Gray-Scott comparison and Monte Carlo forms, time per step
name = "fusion_time"
legend_columns = 2
panel_size = [400, 215]   # shorter: less empty space between the line groups
ylabel = "Time (ms)"   # short enough for the short panels
panels = [
    { config = "configs/multi_gpu/grayscott.toml", results = "results-brev/grayscott-compare", title = "Gray-Scott", log = true },
    { config = "configs/multi_gpu/montecarlo_forms.toml", results = "results-brev/20261005-224227-evLB1b", title = "Monte Carlo", hide = ["PIE.jl (naive)"], relabel = { "PIE.jl (naive, unfused)" = "PIE.jl (unfused)" } },
]

[Global]
n_warmup = 1
n_iter = 1
n_trial = 3
check_correctness = true
auto_size = false
models = ["cunumeric", "cupynumeric", "cudajl", "jacc", "dagger"]

# The five default adapters use the shared class and timing contract.
[[nas_ep]]
T = "Float64"
gpus = 1
cpus = 8
kwargs = { class = "B" }

# High-level counterparts of the explicit CUDA.jl and JACC kernels.
[[nas_ep]]
T = "Float64"
gpus = 1
cpus = 8
models = ["cudajl"]
kwargs = { class = "B", implementation = "broadcast" }

[[nas_ep]]
T = "Float64"
gpus = 1
cpus = 8
models = ["jacc"]
kwargs = { class = "B", implementation = "broadcast" }

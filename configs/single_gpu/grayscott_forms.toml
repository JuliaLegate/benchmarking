# One-GPU size sweep: cuNumeric forms with CUDA.jl and cuPyNumeric references.
# julia --project=. run.jl --config=configs/single_gpu/grayscott_forms.toml
[Global]
single_gpu = true
models = ["cunumeric", "cudajl", "cupynumeric"]
n_warmup = 2
n_iter = 50
n_trial = 5
check_correctness = true
n_correctness_iter = 5
auto_size = false

[plot.groups]
grayscott = [
    "grayscott_plain",
    "grayscott_function_accelerated",
    "grayscott",
]

[[grayscott_plain]]
models = ["cunumeric", "cudajl"]
T = "Float32"
cpus = 8
fusion = "off"
N = [256, 512, 1024, 2048, 4096, 8192]
M = [256, 512, 1024, 2048, 4096, 8192]

[[grayscott_function_accelerated]]
models = ["cunumeric"]
T = "Float32"
cpus = 8
fusion = "on"
N = [256, 512, 1024, 2048, 4096, 8192]
M = [256, 512, 1024, 2048, 4096, 8192]

# cuPyNumeric has one native implementation, not the Julia accelerate forms.
[[grayscott]]
models = ["cupynumeric"]
T = "Float32"
cpus = 8
N = [256, 512, 1024, 2048, 4096, 8192]
M = [256, 512, 1024, 2048, 4096, 8192]

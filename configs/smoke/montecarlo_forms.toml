# Smoke variant of multi_gpu/montecarlo_forms.toml.
[Global]
models = ["cunumeric", "cupynumeric"]
n_warmup = 1
n_iter = 5
n_trial = 2
check_correctness = true
n_correctness_iter = 2
auto_size = false

[plot.groups]
montecarlo = ["montecarlo", "montecarlo_naive"]

[[montecarlo]]
T = "Float32"
gpus = [1, 2, 4, 8]
cpus = 8
fusion = true
N = [16777216, 33554432, 67108864, 134217728]
M = 1

[[montecarlo_naive]]   # cuNumeric only
T = "Float32"
gpus = [1, 2, 4, 8]
cpus = 8
fusion = [true, false]
N = [16777216, 33554432, 67108864, 134217728]
M = 1

# Smoke variant of multi_gpu/nas_mg_weak.toml: class S on every GPU count.
[Global]
models = ["cunumeric", "cupynumeric", "cudajl", "jacc", "dagger"]
n_warmup = 1
n_iter = 5
n_trial = 2
check_correctness = true
n_correctness_iter = 2
auto_size = false

[[nas_mg]]
T = "Float64"
gpus = [1, 2, 4, 8]
cpus = 8
kwargs = { class = "S" }
